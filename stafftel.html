<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StaffTel Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0f1117;
    --surface:  #181c27;
    --border:   #2a2f3e;
    --accent:   #f0b429;
    --accent2:  #3ecf8e;
    --danger:   #f87171;
    --text:     #e8eaf0;
    --muted:    #6b7280;
    --radius:   10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .subtitle { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 2px; }

  .header-actions { display: flex; gap: 10px; }
  button {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 13px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    padding: 9px 16px;
    transition: opacity .15s, transform .1s;
  }
  button:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #0f1117; }
  .btn-danger  { background: var(--danger); color: #fff; }
  .btn-ghost   { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  /* ── STATS ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 24px 28px 0;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    opacity: 0;
    transition: opacity .3s;
  }
  .stat-card.loaded::before { opacity: 1; }
  .stat-icon { font-size: 22px; margin-bottom: 10px; }
  .stat-value {
    font-size: 36px;
    font-weight: 800;
    line-height: 1;
    font-family: 'DM Mono', monospace;
    color: var(--accent);
    transition: all .4s;
  }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }

  /* ── MAIN GRID ── */
  .main {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 16px;
    padding: 20px 28px 28px;
  }

  /* ── PLANNING ── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }

  .planning-list { padding: 8px 0; min-height: 180px; }
  .planning-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    gap: 10px;
  }
  .planning-empty .big { font-size: 32px; }

  .task-row {
    display: grid;
    grid-template-columns: 90px 1fr 110px 80px;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    animation: fadeIn .3s ease;
  }
  .task-row:last-child { border-bottom: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .task-time { font-family: 'DM Mono', monospace; color: var(--accent); font-size: 12px; }
  .task-staff { font-weight: 600; }
  .task-room  { color: var(--muted); font-size: 12px; }
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
  }
  .badge-ok      { background: #143529; color: var(--accent2); }
  .badge-pending { background: #2a2010; color: var(--accent); }
  .badge-absent  { background: #2a1010; color: var(--danger); }

  /* ── STAFF PANEL ── */
  .staff-list { padding: 8px 0; }
  .staff-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    transition: background .15s;
    animation: fadeIn .3s ease;
  }
  .staff-row:last-child { border-bottom: none; }
  .staff-row:hover { background: rgba(255,255,255,.03); }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
    color: var(--accent);
  }
  .staff-info { flex: 1; }
  .staff-name { font-weight: 600; }
  .staff-rol  { font-size: 11px; color: var(--muted); margin-top: 1px; }

  /* ── MODAL AUSENCIA ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    width: 360px;
    animation: slideUp .2s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px; }
  select, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
    transition: border-color .15s;
  }
  select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: none; height: 80px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 18px;
    font-size: 13px;
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 200;
    animation: slideUp .2s ease;
    max-width: 300px;
  }
  #toast.show { display: flex; }
  #toast.error { border-color: var(--danger); }

  /* ── LOADER ── */
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .main  { grid-template-columns: 1fr; }
    .task-row { grid-template-columns: 80px 1fr 80px; }
    .task-room { display: none; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div>
    <div class="logo">Staff<span>Tel</span> Manager</div>
    <div class="subtitle">Manejamos tu tiempo ganado</div>
  </div>
  <div class="header-actions">
    <button class="btn-primary" id="btnGenerar" onclick="generarPlanning()">🤖 Generar Planning</button>
    <button class="btn-danger"  onclick="openModal()">⚠️ Reportar Ausencia</button>
  </div>
</header>

<!-- STATS -->
<div class="stats">
  <div class="stat-card" id="card-staff">
    <div class="stat-icon">👥</div>
    <div class="stat-value" id="statStaff">—</div>
    <div class="stat-label">Staff Disponible</div>
  </div>
  <div class="stat-card" id="card-time">
    <div class="stat-icon">⏱️</div>
    <div class="stat-value" id="statTiempo">—</div>
    <div class="stat-label">Tiempo Total</div>
  </div>
  <div class="stat-card" id="card-ocupacion">
    <div class="stat-icon">📊</div>
    <div class="stat-value" id="statOcupacion">—</div>
    <div class="stat-label">Ocupación Hoy</div>
  </div>
  <div class="stat-card" id="card-rooms">
    <div class="stat-icon">🛏️</div>
    <div class="stat-value" id="statRooms">—</div>
    <div class="stat-label">Habitaciones</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- PLANNING -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">📋 Planning de Hoy</div>
      <div id="planningLoader" style="display:none"><span class="spinner"></span></div>
    </div>
    <div class="planning-list" id="planningList">
      <div class="planning-empty">
        <div class="big">📋</div>
        <div>Cargando planning…</div>
      </div>
    </div>
  </div>

  <!-- STAFF -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">👤 Equipo</div>
    </div>
    <div class="staff-list" id="staffList">
      <div class="planning-empty"><span class="spinner"></span></div>
    </div>
  </div>

</div>

<!-- MODAL AUSENCIA -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>⚠️ Reportar Ausencia</h3>
    <div class="form-group">
      <label>Personal</label>
      <select id="selectStaff">
        <option value="">Seleccionar…</option>
      </select>
    </div>
    <div class="form-group">
      <label>Motivo</label>
      <textarea id="inputMotivo" placeholder="Motivo de la ausencia…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn-danger" id="btnEnviar" onclick="reportarAusencia()">Enviar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
const API = '/api/stafftel';
let staffData = [];

// ── Appel proxy ─────────────────────────────────────────────────────────────
async function callApi(action, extra = {}) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...extra })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  return res.json();
}

// ── Toast ────────────────────────────────────────────────────────────────────
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = (isError ? '❌ ' : '✅ ') + msg;
  el.className = 'show' + (isError ? ' error' : '');
  setTimeout(() => el.className = '', 3500);
}

// ── Chargement initial ───────────────────────────────────────────────────────
async function loadDashboard() {
  try {
    const { data } = await callApi('load_dashboard');

    // Stats
    ['staff','time','ocupacion','rooms'].forEach(id => {
      document.getElementById(`card-${id === 'staff' ? 'staff' : id === 'time' ? 'time' : id === 'ocupacion' ? 'ocupacion' : 'rooms'}`)
        ?.classList.add('loaded');
    });

    document.getElementById('statStaff').textContent    = data.staffDisponible;
    document.getElementById('statRooms').textContent    = data.rooms.length;
    document.getElementById('statOcupacion').textContent = data.ocupacion + '%';

    const mins = data.tiempoTotal;
    document.getElementById('statTiempo').textContent =
      mins >= 60 ? `${Math.floor(mins/60)}h${String(mins%60).padStart(2,'0')}` : `${mins}m`;

    // Staff list + select modal
    staffData = data.staff;
    renderStaff(staffData);
    populateSelect(staffData);

    // Planning
    renderPlanning(data.planning);

  } catch (e) {
    toast('Error al cargar: ' + e.message, true);
    document.getElementById('planningList').innerHTML =
      `<div class="planning-empty"><div>⚠️ ${e.message}</div></div>`;
    document.getElementById('staffList').innerHTML =
      `<div class="planning-empty"><div>⚠️ ${e.message}</div></div>`;
    // Affiche des 0 au lieu de —
    ['statStaff','statTiempo','statOcupacion','statRooms'].forEach(id => {
      document.getElementById(id).textContent = '0';
    });
  }
}

function renderStaff(staff) {
  const el = document.getElementById('staffList');
  if (!staff.length) {
    el.innerHTML = '<div class="planning-empty"><div>Sin personal registrado</div></div>';
    return;
  }
  el.innerHTML = staff.map(s => {
    const initials = s.nombre.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
    const badge = s.statut === 'Ausente'
      ? '<span class="badge badge-absent">Ausente</span>'
      : '<span class="badge badge-ok">Disponible</span>';
    return `<div class="staff-row">
      <div class="avatar">${initials}</div>
      <div class="staff-info">
        <div class="staff-name">${s.nombre}</div>
        <div class="staff-rol">${s.rol}</div>
      </div>
      ${badge}
    </div>`;
  }).join('');
}

function renderPlanning(planning) {
  const el = document.getElementById('planningList');
  if (!planning.length) {
    el.innerHTML = `<div class="planning-empty">
      <div class="big">📋</div>
      <div>No hay planning para hoy.<br>Haz clic en <strong>"Generar Planning"</strong> para crear uno.</div>
    </div>`;
    return;
  }
  el.innerHTML = planning.map(p => `
    <div class="task-row">
      <div class="task-time">${p.horario || '—'}</div>
      <div class="task-staff">${p.staffNombre || '—'}</div>
      <div class="task-room">${p.habitacion || ''}</div>
      <span class="badge badge-pending">${p.statut || 'Pendiente'}</span>
    </div>`).join('');
}

function populateSelect(staff) {
  const sel = document.getElementById('selectStaff');
  sel.innerHTML = '<option value="">Seleccionar…</option>' +
    staff.map(s => `<option value="${s.id}">${s.nombre}</option>`).join('');
}

// ── Generar Planning ─────────────────────────────────────────────────────────
async function generarPlanning() {
  const btn = document.getElementById('btnGenerar');
  btn.disabled = true;
  btn.textContent = '⏳ Generando…';
  document.getElementById('planningLoader').style.display = 'block';
  try {
    await callApi('generar_planning');
    toast('Planning generado correctamente');
    await loadDashboard();
  } catch (e) {
    toast('Error al generar planning: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '🤖 Generar Planning';
    document.getElementById('planningLoader').style.display = 'none';
  }
}

// ── Modal ausencia ────────────────────────────────────────────────────────────
function openModal()  { document.getElementById('modalOverlay').classList.add('open'); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

async function reportarAusencia() {
  const staffId = document.getElementById('selectStaff').value;
  const motivo  = document.getElementById('inputMotivo').value.trim();
  if (!staffId) { toast('Selecciona un miembro del equipo', true); return; }

  const btn = document.getElementById('btnEnviar');
  btn.disabled = true;
  try {
    await callApi('reportar_ausencia', { staffId, motivo });
    toast('Ausencia reportada correctamente');
    closeModal();
    document.getElementById('inputMotivo').value = '';
    await loadDashboard();
  } catch (e) {
    toast('Error: ' + e.message, true);
  } finally {
    btn.disabled = false;
  }
}

// ── Init ─────────────────────────────────────────────────────────────────────
loadDashboard();
</script>
</body>
</html>
