<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏨 StaffTel Manager — Planning Inteligente</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3DBFBF;
            --primary-dark: #1A6B7C;
            --accent: #E67E22;
            --danger: #C0392B;
            --success: #27AE60;
            --bg-light: #F8F9FA;
            --bg-dark: #0D1B2A;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-backdrop: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #1A3A52;
            --text-secondary: #555;
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0D1B2A 0%, #1A3A52 50%, #0D1B2A 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* Buttons */
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #2a9b9b 100%);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-danger {
            background: rgba(192, 57, 43, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-danger:hover {
            background: rgba(192, 57, 43, 0.3);
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 25px;
            box-shadow: var(--shadow-md);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Layout */
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .grid-full {
            grid-column: 1 / -1;
        }

        /* Stats */
        .stat-card {
            background: rgba(61, 191, 191, 0.1);
            border: 1px solid var(--primary);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary);
            margin: 10px 0;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Planning Table */
        .planning-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .planning-table thead {
            background: linear-gradient(135deg, rgba(61, 191, 191, 0.15) 0%, rgba(230, 126, 34, 0.1) 100%);
        }

        .planning-table th {
            padding: 15px;
            text-align: left;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--primary);
        }

        .planning-table td {
            padding: 14px 15px;
            border-bottom: 1px solid rgba(61, 191, 191, 0.1);
            font-size: 14px;
        }

        .planning-table tbody tr {
            transition: all 0.3s ease;
        }

        .planning-table tbody tr:hover {
            background: rgba(61, 191, 191, 0.08);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(230, 126, 34, 0.2);
            color: var(--accent);
        }

        .status-active {
            background: rgba(39, 174, 96, 0.2);
            color: var(--success);
        }

        .status-done {
            background: rgba(52, 152, 219, 0.2);
            color: #3498DB;
        }

        /* Load Bar */
        .load-bar {
            width: 100%;
            height: 8px;
            background: rgba(200, 200, 200, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .load-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        /* Chart Container */
        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--primary-dark);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }

        input[type="text"],
        input[type="time"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="time"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(61, 191, 191, 0.1);
        }

        /* Loading */
        .spinner {
            border: 4px solid var(--glass-border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 20px;
            }

            .header-actions {
                width: 100%;
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        /* Alert */
        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.4s ease-out;
        }

        .alert-warning {
            background: rgba(230, 126, 34, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .alert-success {
            background: rgba(39, 174, 96, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .close-alert {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">🏨 StaffTel Manager</div>
            <div class="header-actions">
                <button class="btn-primary" onclick="generarPlanning()">
                    🎬 Generar Planning
                </button>
                <button class="btn-secondary" onclick="openModal('ausencia')">
                    ⚠️ Reportar Ausencia
                </button>
                <button class="btn-secondary" onclick="reloadData()">
                    🔄 Actualizar
                </button>
            </div>
        </div>

        <!-- Alerts -->
        <div id="alerts"></div>

        <!-- Stats -->
        <div class="grid">
            <div class="stat-card">
                <div class="stat-label">👥 Staff Disponible</div>
                <div class="stat-value" id="statStaff">5</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🛏️ Habitaciones a Limpiar</div>
                <div class="stat-value" id="statHab">18</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">⏱️ Tiempo Total</div>
                <div class="stat-value" id="statTime">660m</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">✅ Promedio por Persona</div>
                <div class="stat-value" id="statAvg">132m</div>
            </div>
        </div>

        <!-- Planning Table -->
        <div class="card grid-full">
            <div class="card-title">📋 Planning de Hoy</div>
            <div id="planningContent">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Chart -->
        <div class="card grid-full">
            <div class="card-title">📊 Carga Semanal por Persona</div>
            <div class="chart-container">
                <canvas id="cargaChart"></canvas>
            </div>
        </div>

        <!-- Staff Status -->
        <div class="card">
            <div class="card-title">👥 Estado del Personal</div>
            <div id="staffStatus">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Summary -->
        <div class="card">
            <div class="card-title">📈 Justificación de Distribución</div>
            <p id="justificacion" style="color: var(--text-secondary); line-height: 1.6;">
                Cargando análisis...
            </p>
        </div>
    </div>

    <!-- Modals -->
    <div id="ausenciaModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">⚠️ Reportar Ausencia</div>
            <div class="form-group">
                <label>Selecciona el Personal</label>
                <select id="staffSelect">
                    <option value="">-- Selecciona una persona --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Motivo (opcional)</label>
                <input type="text" id="motivo" placeholder="ej: Enfermedad">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-danger" style="flex: 1;" onclick="confirmarAusencia()">
                    Confirmar
                </button>
                <button class="btn-secondary" style="flex: 1;" onclick="closeModal()">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <script>
        const N8N_WEBHOOK = 'https://kenzel2122.app.n8n.cloud/webhook/stafftel-planning';
        const AIRTABLE_API = 'https://api.airtable.com/v0/appGrgwkoEmYyWHLn';
        const AIRTABLE_TOKEN = 'pat1SBwwRIAcHHw2h.6673d7ee9f125f7c2476e83d27d03fb7f1bc2a3c5ece5c0fd73d7a38ae185ae7';

        // Data
        let currentPlanning = null;
        let staffData = [];
        let cargaChart = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            reloadData();
        });

        async function reloadData() {
            try {
                await fetchStaff();
                await fetchPlanning();
                updateStats();
                updateChart();
            } catch (e) {
                showAlert('Error cargando datos: ' + e.message, 'warning');
            }
        }

        async function fetchStaff() {
            const res = await fetch(
                `${AIRTABLE_API}/tblPmocIlPhl6yUtY?api_key=${AIRTABLE_TOKEN}`
            );
            const data = await res.json();
            staffData = data.records || [];
            updateStaffSelect();
        }

        async function fetchPlanning() {
            const res = await fetch(
                `${AIRTABLE_API}/tbljr2yKOGVhPBlva?filterByFormula={Fecha}=TODAY()&api_key=${AIRTABLE_TOKEN}`
            );
            const data = await res.json();
            currentPlanning = data.records || [];
            renderPlanning();
        }

        function updateStats() {
            const activeStaff = staffData.filter(s => s.fields['Disponible']).length;
            const totalHab = currentPlanning.length;
            const totalTime = currentPlanning.reduce((sum, p) => sum + (p.fields['Tiempo_Estimado_Min'] || 0), 0);

            document.getElementById('statStaff').textContent = activeStaff;
            document.getElementById('statHab').textContent = totalHab;
            document.getElementById('statTime').textContent = totalTime + 'm';
            document.getElementById('statAvg').textContent = activeStaff > 0 ? Math.round(totalTime / activeStaff) + 'm' : '0m';
        }

        function renderPlanning() {
            if (!currentPlanning.length) {
                document.getElementById('planningContent').innerHTML = `
                    <p style="text-align: center; color: var(--text-secondary); padding: 40px;">
                        No hay planning para hoy. Haz clic en "Generar Planning" para crear uno.
                    </p>
                `;
                return;
            }

            let html = `
                <table class="planning-table">
                    <thead>
                        <tr>
                            <th>👤 Persona</th>
                            <th>🛏️ Habitaciones</th>
                            <th>⏱️ Tiempo</th>
                            <th>📊 Status</th>
                            <th>🔧 Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            currentPlanning.forEach(p => {
                const persona = p.fields['Persona']?.[0] || 'N/A';
                const habitaciones = p.fields['Habitaciones']?.length || 0;
                const tiempo = p.fields['Tiempo_Estimado_Min'] || 0;
                const status = p.fields['Status'] || 'Pendiente';

                let statusClass = 'status-pending';
                if (status === 'En Curso') statusClass = 'status-active';
                if (status === 'Completado') statusClass = 'status-done';

                const progress = status === 'Completado' ? 100 : status === 'En Curso' ? 50 : 0;

                html += `
                    <tr>
                        <td><strong>${persona}</strong></td>
                        <td>${habitaciones} hab</td>
                        <td>${tiempo} min</td>
                        <td>
                            <span class="status-badge ${statusClass}">${status}</span>
                            <div class="load-bar" style="width: 80px;">
                                <div class="load-bar-fill" style="width: ${progress}%"></div>
                            </div>
                        </td>
                        <td>
                            <button class="btn-secondary" style="padding: 6px 12px; font-size: 12px;" 
                                onclick="marcarTerminado('${p.id}')">
                                ✓ Hecho
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            document.getElementById('planningContent').innerHTML = html;
        }

        function updateChart() {
            const ctx = document.getElementById('cargaChart').getContext('2d');

            const labels = staffData.map(s => s.fields['Nombre']);
            const data = staffData.map(s => s.fields['Carga_Semana_Horas'] || 0);

            if (cargaChart) cargaChart.destroy();

            cargaChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: 'Horas esta semana',
                        data,
                        backgroundColor: [
                            'rgba(61, 191, 191, 0.6)',
                            'rgba(230, 126, 34, 0.6)',
                            'rgba(52, 152, 219, 0.6)',
                            'rgba(155, 89, 182, 0.6)',
                            'rgba(39, 174, 96, 0.6)'
                        ],
                        borderRadius: 8,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(200, 200, 200, 0.1)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
        }

        function updateStaffSelect() {
            const select = document.getElementById('staffSelect');
            select.innerHTML = '<option value="">-- Selecciona una persona --</option>';
            staffData.forEach(s => {
                const option = document.createElement('option');
                option.value = s.id;
                option.textContent = s.fields['Nombre'];
                select.appendChild(option);
            });
        }

        async function generarPlanning() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ Generando...';

            try {
                const res = await fetch(N8N_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'generate' })
                });

                const data = await res.json();
                showAlert('✅ Planning generado y enviado a WhatsApp', 'success');
                setTimeout(() => reloadData(), 2000);
            } catch (e) {
                showAlert('Error generando planning: ' + e.message, 'warning');
            } finally {
                btn.disabled = false;
                btn.textContent = '🎬 Generar Planning';
            }
        }

        function openModal(type) {
            document.getElementById(type + 'Modal').classList.add('show');
        }

        function closeModal() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
        }

        function confirmarAusencia() {
            const staffId = document.getElementById('staffSelect').value;
            const motivo = document.getElementById('motivo').value;

            if (!staffId) {
                showAlert('Selecciona una persona', 'warning');
                return;
            }

            // Update Airtable
            fetch(`${AIRTABLE_API}/tblPmocIlPhl6yUtY/${staffId}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    fields: { 'Disponible': false }
                })
            }).then(() => {
                showAlert(`⚠️ ${motivo ? motivo + ' reportado' : 'Ausencia reportada'}. Regenerando planning...`, 'warning');
                generarPlanning();
                closeModal();
                document.getElementById('motivo').value = '';
            });
        }

        function marcarTerminado(recordId) {
            // Update status
            fetch(`${AIRTABLE_API}/tbljr2yKOGVhPBlva/${recordId}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    fields: { 'Status': 'Completado' }
                })
            }).then(() => {
                reloadData();
            });
        }

        function showAlert(msg, type = 'info') {
            const alerts = document.getElementById('alerts');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
                <span>${msg}</span>
                <button class="close-alert" onclick="this.parentElement.remove()">×</button>
            `;
            alerts.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        window.onclick = (e) => {
            if (e.target.classList.contains('modal')) {
                closeModal();
            }
        };
    </script>
</body>
</html>
