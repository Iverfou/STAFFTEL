<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StaffTel Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a4a 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 32px;
            color: #4ade80;
        }

        .header .subtitle {
            color: #fbbf24;
            font-size: 18px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #4ade80;
            color: #1a2a4a;
        }

        .btn-primary:hover {
            background: #22c55e;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #f59e0b;
            color: #1a2a4a;
        }

        .btn-warning:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .stat-label {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 32px;
            color: #4ade80;
            font-weight: bold;
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .section h2 {
            color: #4ade80;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .planning-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .planning-table th {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid rgba(74, 222, 128, 0.2);
        }

        .planning-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(74, 222, 128, 0.1);
        }

        .planning-table tr:hover {
            background: rgba(74, 222, 128, 0.05);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1a2a4a;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .modal-header {
            font-size: 20px;
            color: #4ade80;
            margin-bottom: 20px;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #94a3b8;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.2);
            color: #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: rgba(74, 222, 128, 0.2);
            border: 1px solid #4ade80;
            color: #4ade80;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .alert.active {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        select {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🏨 StaffTel Manager</h1>
                <div class="subtitle">Manejamos tu tiempo ganado</div>
            </div>
            <div class="button-group">
                <button class="btn-primary" onclick="generarPlanning()">🤖 Generar Planning</button>
                <button class="btn-warning" onclick="abrirModalAusencia()">⚠️ Reportar Ausencia</button>
            </div>
        </div>

        <div class="alert" id="alertBox"></div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">👥 Staff Disponible</div>
                <div class="stat-value" id="staffCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">⏱️ Tiempo Total</div>
                <div class="stat-value" id="totalTime">0m</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">📊 Ocupación Hoy</div>
                <div class="stat-value" id="occupancy">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🛏️ Habitaciones</div>
                <div class="stat-value" id="roomCount">0</div>
            </div>
        </div>

        <div class="section">
            <h2>📋 Planning de Hoy</h2>
            <div id="planningContainer">
                <div class="empty-state">
                    No hay planning para hoy. Haz clic en "Generar Planning" para crear uno.
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Ausencia -->
    <div class="modal" id="modalAusencia">
        <div class="modal-content">
            <div class="modal-header">Reportar Ausencia</div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Personal</label>
                    <select id="staffSelect" onchange="updateMotivo()">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Motivo</label>
                    <textarea id="motivo" placeholder="Describe el motivo..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-warning" onclick="reportarAusencia()">Enviar</button>
                <button onclick="cerrarModal('modalAusencia')" style="background: #6b7280; color: white;">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // ===== CONFIG =====
        const N8N_WEBHOOK = 'https://kenzel2122.app.n8n.cloud/webhook/stafftel-planning';
        const AIRTABLE_API = 'https://api.airtable.com/v0/appGrgwkoEmYyWHLn';
        const AIRTABLE_TOKEN = 'pat1SBwwRIAcHHw2h.6673d7ee9f125f7c2476e83d27d03fb7f1bc2a3c5ece5c0fd73d7a38ae185ae7';

        // Table IDs
        const TABLE_HABITACIONES = 'tblPZTC3cxUuMnhD8';
        const TABLE_STAFF = 'tblPmocIlPhl6yUtY';
        const TABLE_PLANNING = 'tbljr2yKOGVhPBlva';

        // ===== DATA =====
        let staffData = [];
        let planningData = [];
        let habitacionesData = [];

        // ===== INIT =====
        window.addEventListener('load', () => {
            cargarDatos();
        });

        async function cargarDatos() {
            await fetchHabitaciones();
            await fetchStaff();
            await fetchPlanning();
        }

        // ===== FETCH FUNCTIONS =====
        async function fetchHabitaciones() {
            try {
                const res = await fetch(
                    `${AIRTABLE_API}/${TABLE_HABITACIONES}?api_key=${AIRTABLE_TOKEN}`
                );
                const data = await res.json();
                habitacionesData = data.records || [];
                document.getElementById('roomCount').textContent = habitacionesData.length;
            } catch (e) {
                showAlert('Error cargando habitaciones', 'error');
            }
        }

        async function fetchStaff() {
            try {
                const res = await fetch(
                    `${AIRTABLE_API}/${TABLE_STAFF}?api_key=${AIRTABLE_TOKEN}`
                );
                const data = await res.json();
                staffData = data.records || [];
                document.getElementById('staffCount').textContent = staffData.length;
                updateStaffSelect();
            } catch (e) {
                showAlert('Error cargando staff', 'error');
            }
        }

        async function fetchPlanning() {
            try {
                const res = await fetch(
                    `${AIRTABLE_API}/${TABLE_PLANNING}?filterByFormula={Fecha}=TODAY()&api_key=${AIRTABLE_TOKEN}`
                );
                const data = await res.json();
                planningData = data.records || [];
                renderPlanning();
            } catch (e) {
                showAlert('Error cargando planning', 'error');
            }
        }

        // ===== FUNCTIONS =====
        function updateStaffSelect() {
            const select = document.getElementById('staffSelect');
            select.innerHTML = '<option value="">Seleccionar...</option>';
            staffData.forEach(staff => {
                const option = document.createElement('option');
                option.value = staff.id;
                option.textContent = staff.fields.Nombre || 'Sin nombre';
                select.appendChild(option);
            });
        }

        function renderPlanning() {
            const container = document.getElementById('planningContainer');
            if (planningData.length === 0) {
                container.innerHTML = '<div class="empty-state">No hay planning para hoy. Haz clic en "Generar Planning" para crear uno.</div>';
                return;
            }

            let html = '<table class="planning-table"><thead><tr><th>Personal</th><th>Habitación</th><th>Tipo</th><th>Hora</th><th>Acciones</th></tr></thead><tbody>';
            planningData.forEach(record => {
                html += `<tr>
                    <td>${record.fields.Personal || '-'}</td>
                    <td>${record.fields.Habitacion || '-'}</td>
                    <td>${record.fields.Tipo || '-'}</td>
                    <td>${record.fields.Hora || '-'}</td>
                    <td><button class="btn-primary" style="padding:8px 12px;" onclick="marcarTerminado('${record.id}')">✓ Hecho</button></td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        async function generarPlanning() {
            try {
                showAlert('Generando planning...', 'success');
                const response = await fetch(N8N_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'generar_planning' })
                });
                if (response.ok) {
                    setTimeout(() => {
                        fetchPlanning();
                        showAlert('✅ Planning generado correctamente', 'success');
                    }, 2000);
                }
            } catch (e) {
                showAlert('Error generando planning', 'error');
            }
        }

        async function reportarAusencia() {
            const staffId = document.getElementById('staffSelect').value;
            const motivo = document.getElementById('motivo').value;

            if (!staffId) {
                showAlert('Selecciona un personal', 'error');
                return;
            }

            try {
                await fetch(`${AIRTABLE_API}/${TABLE_STAFF}/${staffId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fields: { 'Disponible': false }
                    })
                });
                showAlert('⚠️ Ausencia reportada. Regenerando planning...', 'success');
                generarPlanning();
                cerrarModal('modalAusencia');
            } catch (e) {
                showAlert('Error reportando ausencia', 'error');
            }
        }

        async function marcarTerminado(recordId) {
            try {
                await fetch(`${AIRTABLE_API}/${TABLE_PLANNING}/${recordId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fields: { 'Status': 'Completado' }
                    })
                });
                fetchPlanning();
                showAlert('✓ Tarea marcada como completada', 'success');
            } catch (e) {
                showAlert('Error marcando tarea', 'error');
            }
        }

        // ===== MODAL FUNCTIONS =====
        function abrirModalAusencia() {
            document.getElementById('modalAusencia').classList.add('active');
        }

        function cerrarModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function updateMotivo() {
            // Placeholder para actualizar motivo según staff
        }

        // ===== ALERT FUNCTION =====
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert ${type} active`;
            setTimeout(() => {
                alertBox.classList.remove('active');
            }, 3000);
        }

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('modalAusencia');
            if (event.target === modal) {
                modal.classList.remove('active');
            }
        }
    </script>
</body>
</html>
